<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket Admin - Miami '26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 max-w-5xl">
        <h1 class="text-3xl font-black text-center text-indigo-900 my-8 uppercase tracking-tighter italic">
            🌴 Miami Masters '26 Admin
        </h1>

        <div id="password-view" class="bg-white p-10 rounded-2xl shadow-xl text-center max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-6">Staff Access Only</h2>
            <input type="password" id="password-input" class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-indigo-500 mb-4" placeholder="Enter Password">
            <button id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-all">
                Login to Dashboard
            </button>
            <p id="error-message" class="text-red-500 mt-4 text-sm font-medium"></p>
        </div>

        <div id="admin-content" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="font-medium text-gray-500 text-sm">Tournament ID: <span id="tourn-id-display" class="text-indigo-600 font-bold"></span></p>
                <div class="flex gap-4">
                     <span id="save-status" class="text-sm font-bold self-center"></span>
                     <button id="save-results-btn" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-green-700 shadow-md transition-all">
                        Save Match Results
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-black text-indigo-800 uppercase italic">Participant Monitor</h2>
                    <span id="participant-count" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full italic">0 Participants</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="text-[10px] font-black uppercase text-slate-400 border-b">
                                <th class="pb-2">Real Name</th>
                                <th class="pb-2">Nickname</th>
                                <th class="pb-2">Sync Code</th>
                                <th class="pb-2">Document ID</th>
                            </tr>
                        </thead>
                        <tbody id="participant-list-body" class="divide-y divide-gray-50">
                            <tr><td colspan="4" class="py-4 text-center text-gray-400 italic">Loading participants...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-xl font-black mb-6 text-indigo-800 border-b pb-2 uppercase italic">Men's Draw</h2>
                    <div id="mens-results" class="space-y-2"></div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-xl font-black mb-6 text-indigo-800 border-b pb-2 uppercase italic">Women's Draw</h2>
                    <div id="womens-results" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // Updated imports to include collection and getDocs
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const ADMIN_PASSWORD = "your-secret-password"; 

        const ALL_ROUNDS = [
            { key: 'r128', name: 'Round of 128', matches: 64 },
            { key: 'r64', name: 'Round of 64', matches: 32 },
            { key: 'r32', name: 'Round of 32', matches: 16 },
            { key: 'r16', name: 'Round of 16', matches: 8 },
            { key: 'qf', name: 'Quarterfinals', matches: 4 },
            { key: 'sf', name: 'Semifinals', matches: 2 },
            { key: 'f', name: 'Final', matches: 1 }
        ];

        let db, auth, appConfig, tournamentData;
        let activeRounds = [];
        let actualResults = {};

        const loginBtn = document.getElementById('login-btn');
        const passwordInput = document.getElementById('password-input');

        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keyup', (e) => e.key === 'Enter' && handleLogin());

        async function handleLogin() {
            if (passwordInput.value !== ADMIN_PASSWORD) {
                document.getElementById('error-message').textContent = "Incorrect password.";
                return;
            }

            try {
                const configModule = await import('./app-config.js');
                appConfig = configModule.appConfig;
                
                const app = initializeApp(configModule.firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);

                const startIdx = ALL_ROUNDS.findIndex(r => r.key === appConfig.STARTING_ROUND);
                activeRounds = ALL_ROUNDS.slice(startIdx);
                
                await loadData();
                showAdminView();
            } catch (err) {
                document.getElementById('error-message').textContent = `Initialization Error: ${err.message}`;
            }
        }

        async function loadData() {
            const res = await fetch(`tournament_data.json?v=${Date.now()}`);
            tournamentData = await res.json();
            document.getElementById('tourn-id-display').textContent = appConfig.TOURNAMENT_ID;

            const resultsDoc = await getDoc(doc(db, "tournaments", appConfig.TOURNAMENT_ID, "results", "actualResults"));
            if (resultsDoc.exists()) actualResults = resultsDoc.data().winners || {};
        }

        // Fetches real-time participant status from the collection
        async function loadParticipants() {
            const body = document.getElementById('participant-list-body');
            const countEl = document.getElementById('participant-count');

            try {
                const querySnap = await getDocs(collection(db, "tournaments", appConfig.TOURNAMENT_ID, "participants"));
                body.innerHTML = '';
                let count = 0;

                querySnap.forEach(doc => {
                    const p = doc.data();
                    // Filters out ghost documents that have no names yet
                    if (!p.fullName && !p.nickname) return; 

                    count++;
                    const row = document.createElement('tr');
                    row.className = "hover:bg-indigo-50 transition-colors border-b last:border-0";
                    row.innerHTML = `
                        <td class="py-3 font-bold text-indigo-950">${p.fullName || '---'}</td>
                        <td class="py-3 text-slate-600">${p.nickname || '---'}</td>
                        <td class="py-3 font-mono text-indigo-600 font-bold">${p.syncCode || '-----'}</td>
                        <td class="py-3 text-[10px] text-slate-300 font-mono">${doc.id}</td>
                    `;
                    body.appendChild(row);
                });
                countEl.textContent = `${count} Participants`;
            } catch (err) {
                body.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-500">Error loading: ${err.message}</td></tr>`;
            }
        }

        function showAdminView() {
            document.getElementById('password-view').classList.add('hidden');
            document.getElementById('admin-content').classList.remove('hidden');
            renderForms();
            loadParticipants(); // Trigger participant scan on login
        }

        function renderForms() {
            document.getElementById('mens-results').innerHTML = createFormHTML(tournamentData.mens_draw, 'mens');
            document.getElementById('womens-results').innerHTML = createFormHTML(tournamentData.womens_draw, 'womens');
            
            document.getElementById('save-results-btn').onclick = saveResults;
            document.querySelectorAll('select').forEach(sel => sel.onchange = (e) => {
                if (e.target.value) actualResults[e.target.id] = e.target.value;
                else delete actualResults[e.target.id];
                renderForms(); 
            });
        }

        function createFormHTML(draw, category) {
            let html = '';
            let prevWinners = {};

            activeRounds.forEach((round, roundIdx) => {
                html += `<h3 class="text-xs font-bold uppercase tracking-widest text-indigo-400 mt-6 mb-2">${round.name}</h3>`;
                
                for (let i = 0; i < round.matches; i++) {
                    const matchId = `${category}-${round.key}-match-${i}`;
                    let p1 = 'TBD', p2 = 'TBD';

                    if (roundIdx === 0) {
                        p1 = draw[i].players[0][1];
                        p2 = draw[i].players[1][1];
                    } else {
                        const prevKey = activeRounds[roundIdx - 1].key;
                        const p1_val = actualResults[`${category}-${prevKey}-match-${i * 2}`];
                        const p2_val = actualResults[`${category}-${prevKey}-match-${i * 2 + 1}`];
                        p1 = Array.isArray(p1_val) ? p1_val[1] : (p1_val || 'TBD');
                        p2 = Array.isArray(p2_val) ? p2_val[1] : (p2_val || 'TBD');
                    }
                    
                    if (actualResults[matchId]) prevWinners[matchId] = actualResults[matchId];
                    const isDisabled = p1 === 'TBD' || p2 === 'TBD';

                    html += `
                        <div class="p-2 border-b border-gray-100 flex items-center justify-between gap-2">
                            <span class="text-[10px] font-mono text-gray-300">#${i}</span>
                            <select id="${matchId}" class="flex-1 text-xs border-gray-200 rounded p-1 ${isDisabled ? 'bg-gray-50' : ''}" ${isDisabled ? 'disabled' : ''}>
                                <option value="">Winner?</option>
                                <option value="${p1}" ${actualResults[matchId] === p1 ? 'selected' : ''}>${p1}</option>
                                <option value="${p2}" ${actualResults[matchId] === p2 ? 'selected' : ''}>${p2}</option>
                            </select>
                        </div>`;
                }
            });
            return html;
        }

        async function saveResults() {
            const status = document.getElementById('save-status');
            status.textContent = "⌛ Saving...";
            try {
                await setDoc(doc(db, "tournaments", appConfig.TOURNAMENT_ID, "results", "actualResults"), { winners: actualResults });
                status.textContent = "✅ Saved!";
                setTimeout(() => status.textContent = '', 3000);
            } catch (err) {
                status.textContent = "❌ Error";
            }
        }
    </script>
</body>
</html>
